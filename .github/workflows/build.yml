name: Build & Test
on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!fastlane/**'
      - '!i18n/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals.xml'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIHON_GITHUB_RELEASE: true

jobs:
  build:
    name: Build & Test App
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SHENSHANG_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/shenshang.keystore

      - name: Run unit tests
        id: unit_tests
        env:
          storeFileBase64: ${{ secrets.SHENSHANG_KEYSTORE_B64 }}
          storePassword: ${{ secrets.SHENSHANG_KEYSTORE_PASS }}
          keyAlias: ${{ secrets.SHENSHANG_KEY_ALIAS }}
          keyPassword: ${{ secrets.SHENSHANG_KEY_PASS }}
        run: ./gradlew testDebugUnitTest

      - name: Upload test report
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest

      - name: Build debug APK
        env:
          storeFileBase64: ${{ secrets.SHENSHANG_KEYSTORE_B64 }}
          storePassword: ${{ secrets.SHENSHANG_KEYSTORE_PASS }}
          keyAlias: ${{ secrets.SHENSHANG_KEY_ALIAS }}
          keyPassword: ${{ secrets.SHENSHANG_KEY_PASS }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shenshang-manga-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
