name: Release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  MIHON_GITHUB_RELEASE: true

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
          fi

      - name: Build debug APK (with fixed signing)
        env:
          storeFileBase64: ${{ secrets.SHENSHANG_KEYSTORE_B64 }}
          storePassword: ${{ secrets.SHENSHANG_KEYSTORE_PASS }}
          keyAlias: ${{ secrets.SHENSHANG_KEY_ALIAS }}
          keyPassword: ${{ secrets.SHENSHANG_KEY_PASS }}
        run: ./gradlew assembleDebug

      - name: Rename APKs
        run: |
          set -e
          cd app/build/outputs/apk/debug/
          for f in *.apk; do
            mv "$f" "shenshang-manga-${f%.apk}-${{ steps.tag.outputs.tag }}.apk"
          done
          ls -la *.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 神殇漫画 ${{ steps.tag.outputs.tag }}
          body: |
            ## 神殇漫画 ${{ steps.tag.outputs.tag }}

            基于 Mihon 的 Komga 漫画客户端，内置服务器地址和登录。

            ### 安装
            - 现代手机安装 `app-arm64-v8a-debug` 版本
            - 不确定架构安装 `app-universal-debug` 版本
            - 可直接覆盖安装，无需卸载旧版本

            ### 功能
            - 📚 多媒体库目录树浏览
            - 🎬 视频/音频播放支持
            - 🔐 启动登录验证
            - 🔄 每日自动合并上游更新
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
