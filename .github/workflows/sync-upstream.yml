name: Sync Upstream

on:
  schedule:
    # Every day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-mihon:
    name: Merge mihonapp/mihon into main
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/mihonapp/mihon.git
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          UPSTREAM=upstream/main
          BASE=$(git rev-parse HEAD)
          echo "base_sha=$BASE" >> $GITHUB_OUTPUT

          if git merge-base --is-ancestor $UPSTREAM $BASE; then
            echo "No upstream changes to merge."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Upstream has new commits."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Attempt merge
        id: merge
        if: steps.check.outputs.has_changes == 'true'
        run: |
          if git merge upstream/main --no-edit; then
            # GITHUB_TOKEN can never push changes to .github/workflows/*.
            # If the merge touched them, keep the fork's workflow files.
            if ! git diff --quiet origin/main HEAD -- .github/workflows/; then
              echo "Merge modified .github/workflows/, restoring fork versions."
              git checkout origin/main -- .github/workflows/
              git commit --amend --no-edit
            fi
            echo "merge_success=true" >> $GITHUB_OUTPUT
          else
            echo "Merge conflict detected, aborting merge."
            git merge --abort
            echo "merge_success=false" >> $GITHUB_OUTPUT
          fi

      - name: Push merged main
        if: steps.merge.outputs.merge_success == 'true'
        run: |
          git push origin main

      - name: Create PR on conflict
        if: steps.merge.outputs.merge_success == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync-upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git merge upstream/main --no-edit || true
          git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
          if [ -s /tmp/conflicts.txt ]; then
            echo "Conflicted files:"
            cat /tmp/conflicts.txt
          fi
          # Resolve workflow conflicts with the fork's version: GITHUB_TOKEN
          # is not allowed to push commits that touch .github/workflows/*.
          git checkout --ours -- .github/workflows/ || true
          git add -A || true
          git commit -m "chore: merge upstream (conflicts need manual resolution)" --no-verify || true
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: sync upstream $(date +%Y-%m-%d)" \
            --body "Automated upstream sync from mihonapp/mihon. This PR was created because the automatic merge had conflicts that need manual resolution." \
            --base main \
            --head "$BRANCH" \
            --label "sync-upstream" || true

  sync-extensions:
    name: Check keiyoushi/extensions updates
    runs-on: ubuntu-24.04
    needs: sync-mihon

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for extension index changes
        id: check
        run: |
          # Fetch the latest extension index from keiyoushi
          curl -sL https://github.com/keiyoushi/extensions/raw/repo/index.min.json -o /tmp/index_new.json || true
          if [ ! -f /tmp/index_new.json ] || [ ! -s /tmp/index_new.json ]; then
            echo "Could not fetch extension index, skipping."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if we have a stored copy
          if [ -f .github/extension-index.json ]; then
            if diff -q .github/extension-index.json /tmp/index_new.json > /dev/null 2>&1; then
              echo "No extension changes."
              echo "has_changes=false" >> $GITHUB_OUTPUT
            else
              echo "Extension index changed."
              echo "has_changes=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "No stored index, creating initial copy."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Update extension index
        if: steps.check.outputs.has_changes == 'true'
        run: |
          cp /tmp/index_new.json .github/extension-index.json
          git add .github/extension-index.json
          git commit -m "chore: update keiyoushi extension index $(date +%Y-%m-%d)" || true
          git push origin main
